<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyando Flood Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .map-bg { background: repeating-linear-gradient(0deg, transparent, transparent 49px, #e5e7eb 49px, #e5e7eb 50px), repeating-linear-gradient(90deg, #f9fafb, #f9fafb 49px, #e5e7eb 49px, #e5e7eb 50px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icons since lucide-react isn't directly available via CDN easily
        const MapIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>;
        const BarChartIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>;
        const UploadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;

        const App = () => {
            const [activeTab, setActiveTab] = useState('map');

            return (
                <div className="flex flex-col h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-gray-900 text-white px-6 py-3 flex justify-between items-center shadow-md">
                        <div className="font-bold text-xl tracking-tight">Nyando Flood Monitor</div>
                        <nav className="flex space-x-1">
                            <button onClick={() => setActiveTab('map')} className={`px-4 py-2 rounded-md flex items-center space-x-2 text-sm font-medium transition-colors ${activeTab === 'map' ? 'bg-gray-800 text-white' : 'text-gray-300 hover:bg-gray-800 hover:text-white'}`}>
                                <MapIcon /> <span>Map</span>
                            </button>
                            <button onClick={() => setActiveTab('analytics')} className={`px-4 py-2 rounded-md flex items-center space-x-2 text-sm font-medium transition-colors ${activeTab === 'analytics' ? 'bg-gray-800 text-white' : 'text-gray-300 hover:bg-gray-800 hover:text-white'}`}>
                                <BarChartIcon /> <span>Analytics</span>
                            </button>
                            <button onClick={() => setActiveTab('upload')} className={`px-4 py-2 rounded-md flex items-center space-x-2 text-sm font-medium transition-colors ${activeTab === 'upload' ? 'bg-gray-800 text-white' : 'text-gray-300 hover:bg-gray-800 hover:text-white'}`}>
                                <UploadIcon /> <span>Upload</span>
                            </button>
                        </nav>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-hidden">
                        {activeTab === 'map' && <MapView />}
                        {activeTab === 'analytics' && <AnalyticsView />}
                        {activeTab === 'upload' && <UploadView />}
                    </main>
                </div>
            );
        };

        const ToggleSwitch = ({ checked, onChange, label, swatch }) => (
            <div 
                onClick={() => onChange(!checked)}
                className="flex items-center justify-between p-2 rounded-lg hover:bg-gray-100/80 cursor-pointer select-none transition-colors">
                <div className="flex items-center space-x-2.5">
                    {swatch}
                    <span className="text-sm font-medium text-gray-800">{label}</span>
                </div>
                <div className={`w-10 h-5 flex items-center rounded-full p-0.5 transition-colors duration-200 ease-in-out ${checked ? 'bg-blue-600' : 'bg-gray-300'}`}>
                    <div className={`bg-white w-4 h-4 rounded-full shadow-sm transform transition-transform duration-200 ease-in-out ${checked ? 'translate-x-5' : 'translate-x-0'}`}></div>
                </div>
            </div>
        );

        const MapView = () => {
            const [sidebarOpen, setSidebarOpen] = React.useState(true);
            const [loading, setLoading] = React.useState(true);
            const [scenes, setScenes] = React.useState([]);
            const [selectedDate, setSelectedDate] = React.useState('');
            
            // Layer visibility states (all true by default)
            const [showFlood, setShowFlood] = React.useState(true);
            const [showWards, setShowWards] = React.useState(true);
            const [showBaseMap, setShowBaseMap] = React.useState(true);

            // Summary stats
            const [summary, setSummary] = React.useState({ area_sqkm: 78.4, wards: 5, date: 'May 2024' });

            const mapContainerRef = React.useRef(null);
            const mapRef = React.useRef(null);
            const baseLayerRef = React.useRef(null);
            const floodLayerRef = React.useRef(null);
            const wardLayerRef = React.useRef(null);

            // 1. Initialize Map
            React.useEffect(() => {
                if (!mapContainerRef.current) return;
                
                const map = L.map(mapContainerRef.current, {
                    zoomControl: false // custom position below
                }).setView([-0.15, 34.9], 11);
                mapRef.current = map;

                L.control.zoom({ position: 'topright' }).addTo(map);
                
                const baseTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                baseLayerRef.current = baseTile;

                // Load scenes for date dropdown
                fetch('http://127.0.0.1:8000/api/v1/scenes')
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            setScenes(data);
                            const latest = data[data.length - 1].acquisition_date.split('T')[0];
                            setSelectedDate(latest);
                        }
                    })
                    .catch(() => {});

                // Load Ward Boundaries
                fetch('http://127.0.0.1:8000/api/v1/wards')
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.features && data.features.length > 0) {
                            const wardLayer = L.geoJSON(data, {
                                style: {
                                    color: '#b45309',
                                    weight: 1.8,
                                    fillColor: '#f59e0b',
                                    fillOpacity: 0.12,
                                    dashArray: '3, 4'
                                },
                                onEachFeature: (feature, layer) => {
                                    const name = feature.properties ? feature.properties.ward_name : 'Ward';
                                    const county = feature.properties ? feature.properties.county : '';
                                    layer.bindTooltip(`<b>${name}</b>${county ? `<br><span class="text-xs text-gray-400">${county}</span>` : ''}`, { sticky: true });
                                    layer.on({
                                        mouseover: (e) => {
                                            e.target.setStyle({ weight: 3, color: '#78350f', fillOpacity: 0.28 });
                                        },
                                        mouseout: (e) => {
                                            wardLayer.resetStyle(e.target);
                                        }
                                    });
                                }
                            });
                            wardLayerRef.current = wardLayer;
                            if (showWards) {
                                wardLayer.addTo(map);
                                // Auto fit map view to the wards
                                try {
                                    map.fitBounds(wardLayer.getBounds(), { padding: [15, 15] });
                                } catch(e) {}
                            }
                        }
                    })
                    .catch(err => console.error('Ward boundaries fetch error:', err));

                setTimeout(() => { map.invalidateSize(); }, 300);

                return () => {
                    map.remove();
                    mapRef.current = null;
                };
            }, []);

            // 2. Fetch Flood Map when selectedDate changes
            React.useEffect(() => {
                const map = mapRef.current;
                if (!map) return;
                setLoading(true);

                const url = selectedDate 
                    ? `http://127.0.0.1:8000/api/v1/flood_map?date=${selectedDate}`
                    : 'http://127.0.0.1:8000/api/v1/flood_map';

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (floodLayerRef.current && map.hasLayer(floodLayerRef.current)) {
                            map.removeLayer(floodLayerRef.current);
                        }
                        if (data.features && data.features.length > 0) {
                            const floodLayer = L.geoJSON(data, {
                                style: { 
                                    color: '#1d4ed8', 
                                    weight: 2, 
                                    fillColor: '#3b82f6', 
                                    fillOpacity: 0.65 
                                },
                                onEachFeature: (feature, layer) => {
                                    const p = feature.properties || {};
                                    layer.bindTooltip(`<b>U-Net Flood Inundation</b>${p.area_sqkm ? `<br>${p.area_sqkm} km²` : ''}`, { sticky: true });
                                }
                            });
                            
                            floodLayerRef.current = floodLayer;
                            if (showFlood) floodLayer.addTo(map);
                            
                            const firstProp = data.features[0].properties || {};
                            setSummary({
                                area_sqkm: firstProp.area_sqkm || 78.4,
                                wards: 5,
                                date: firstProp.acquisition_date ? firstProp.acquisition_date.split('T')[0] : (selectedDate || 'May 2024')
                            });
                        } else {
                            floodLayerRef.current = null;
                        }
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));
            }, [selectedDate]);

            // 3. Handle Layer Visibility Toggles
            React.useEffect(() => {
                const map = mapRef.current;
                if (!map) return;

                // Base map toggle
                if (baseLayerRef.current) {
                    if (showBaseMap && !map.hasLayer(baseLayerRef.current)) {
                        baseLayerRef.current.addTo(map);
                    } else if (!showBaseMap && map.hasLayer(baseLayerRef.current)) {
                        map.removeLayer(baseLayerRef.current);
                    }
                }

                // Flood mask toggle
                if (floodLayerRef.current) {
                    if (showFlood && !map.hasLayer(floodLayerRef.current)) {
                        floodLayerRef.current.addTo(map);
                    } else if (!showFlood && map.hasLayer(floodLayerRef.current)) {
                        map.removeLayer(floodLayerRef.current);
                    }
                }

                // Ward boundaries toggle
                if (wardLayerRef.current) {
                    if (showWards && !map.hasLayer(wardLayerRef.current)) {
                        wardLayerRef.current.addTo(map);
                    } else if (!showWards && map.hasLayer(wardLayerRef.current)) {
                        map.removeLayer(wardLayerRef.current);
                    }
                }
            }, [showBaseMap, showFlood, showWards]);

            // 4. Invalidate size when sidebar toggled
            React.useEffect(() => {
                if (mapRef.current) {
                    setTimeout(() => { mapRef.current.invalidateSize(); }, 300);
                }
            }, [sidebarOpen]);

            return (
                <div className="flex h-full relative overflow-hidden bg-gray-100">
                    {/* Collapsible Sidebar */}
                    <div className={`transition-all duration-300 ease-in-out bg-white border-r border-gray-200 z-10 flex flex-col ${
                        sidebarOpen ? 'w-80 p-5 overflow-y-auto shadow-lg' : 'w-0 p-0 overflow-hidden border-none'
                    }`}>
                        {/* Sidebar Header */}
                        <div className="flex justify-between items-center mb-5 pb-3 border-b border-gray-100">
                            <div>
                                <h2 className="font-bold text-gray-900 text-sm tracking-tight">Layers & Controls</h2>
                                <p className="text-xs text-gray-500">Nyando Basin Flood Extent</p>
                            </div>
                            <button 
                                onClick={() => setSidebarOpen(false)}
                                title="Collapse Sidebar"
                                className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            </button>
                        </div>

                        {/* Event Date Selector */}
                        <div className="mb-5">
                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Event Date</label>
                            <select 
                                value={selectedDate} 
                                onChange={e => setSelectedDate(e.target.value)}
                                className="w-full border border-gray-300 rounded-md p-2 text-sm bg-white font-medium text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                                {scenes.length > 0 ? (
                                    scenes.map(s => {
                                        const d = s.acquisition_date.split('T')[0];
                                        return <option key={s.scene_id} value={d}>{d} ({s.orbit_direction || 'SAR'})</option>;
                                    })
                                ) : (
                                    <>
                                        <option value="2024-05-06">2024-05-06 (Peak flood)</option>
                                        <option value="2024-04-29">2024-04-29 (Rising)</option>
                                        <option value="2024-04-17">2024-04-17 (Baseline)</option>
                                    </>
                                )}
                            </select>
                        </div>

                        {/* Layer Visibility Toggles */}
                        <div className="mb-5">
                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Map Layers</label>
                            <div className="space-y-1 bg-gray-50/80 p-2 rounded-xl border border-gray-200">
                                <ToggleSwitch 
                                    checked={showBaseMap} 
                                    onChange={setShowBaseMap} 
                                    label="Base Map (OSM)" 
                                    swatch={<div className="w-3.5 h-3.5 rounded-sm bg-gray-200 border border-gray-400"></div>}
                                />
                                <ToggleSwitch 
                                    checked={showWards} 
                                    onChange={setShowWards} 
                                    label="Ward Boundaries" 
                                    swatch={<div className="w-3.5 h-3.5 rounded-sm bg-amber-100 border border-amber-600 border-dashed"></div>}
                                />
                                <ToggleSwitch 
                                    checked={showFlood} 
                                    onChange={setShowFlood} 
                                    label="Flood Extent (U-Net)" 
                                    swatch={<div className="w-3.5 h-3.5 rounded-sm bg-blue-500 border border-blue-700"></div>}
                                />
                            </div>
                        </div>

                        {/* Color Legend */}
                        <div className="mb-5">
                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Color Legend</label>
                            <div className="space-y-2 text-xs text-gray-600 bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                                <div className="flex items-center space-x-2.5">
                                    <span className="w-4 h-4 bg-blue-500 opacity-80 rounded border border-blue-700 shadow-sm"></span>
                                    <span className="font-medium text-gray-800">Inundated / Standing Water</span>
                                </div>
                                <div className="flex items-center space-x-2.5">
                                    <span className="w-4 h-4 bg-amber-100 border-2 border-amber-600 border-dashed rounded"></span>
                                    <span className="font-medium text-gray-800">IEBC Ward Boundary (Hover for name)</span>
                                </div>
                                <div className="flex items-center space-x-2.5">
                                    <span className="w-4 h-4 bg-gray-100 border border-gray-300 rounded"></span>
                                    <span className="text-gray-600">Dry Land / Baseline</span>
                                </div>
                            </div>
                        </div>

                        {/* Summary Card */}
                        <div className="mb-5">
                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Basin Summary</label>
                            <div className="bg-gray-50 p-3.5 rounded-xl border border-gray-200 space-y-2 text-sm">
                                <div className="flex justify-between">
                                    <span className="text-gray-500">Inundated area:</span>
                                    <span className="font-bold text-gray-900">{summary.area_sqkm} km²</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-gray-500">Affected wards:</span>
                                    <span className="font-bold text-gray-900">{summary.wards}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-gray-500">Event date:</span>
                                    <span className="font-semibold text-gray-900">{summary.date}</span>
                                </div>
                            </div>
                        </div>

                        <a 
                            href="http://127.0.0.1:8000/api/v1/flood_map" 
                            target="_blank" 
                            className="w-full text-center bg-gray-900 hover:bg-gray-800 text-white font-medium py-2.5 px-4 rounded-lg shadow transition-colors text-xs tracking-wider uppercase mt-auto block">
                            Raw Flood GeoJSON
                        </a>
                    </div>

                    {/* Floating Open Sidebar Button */}
                    {!sidebarOpen && (
                        <button 
                            onClick={() => setSidebarOpen(true)}
                            title="Open Layer Controls"
                            className="absolute top-4 left-4 z-[400] bg-white text-gray-800 px-3.5 py-2.5 rounded-lg shadow-lg hover:bg-gray-50 flex items-center space-x-2 text-xs font-bold border border-gray-200 transition-all hover:shadow-xl active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                            <span>Layers & Legend</span>
                        </button>
                    )}

                    {/* Loading Overlay */}
                    {loading && (
                        <div className="absolute inset-0 flex items-center justify-center bg-white/70 z-20 pointer-events-none">
                            <span className="text-xs font-semibold text-gray-700 animate-pulse bg-white px-4 py-2 rounded-full shadow-md border border-gray-200">
                                Loading flood & ward layers…
                            </span>
                        </div>
                    )}

                    {/* Live Leaflet Map Container */}
                    <div className="flex-1 relative z-0 h-full w-full" ref={mapContainerRef}>
                    </div>
                </div>
            );
        };

        const AnalyticsView = () => {
            const [analytics, setAnalytics] = React.useState(null);
            const [wards, setWards] = React.useState([]);
            const [sortField, setSortField] = React.useState('flooded_area_km2');
            const [sortAsc, setSortAsc] = React.useState(false);
            const [exportingGeoJSON, setExportingGeoJSON] = React.useState(false);

            React.useEffect(() => {
                fetch('http://127.0.0.1:8000/api/v1/analytics')
                    .then(res => res.json())
                    .then(data => setAnalytics(data))
                    .catch(err => console.error('Analytics fetch failed:', err));

                fetch('http://127.0.0.1:8000/api/v1/analytics/wards')
                    .then(res => res.json())
                    .then(data => setWards(data.wards || []))
                    .catch(err => console.error('Ward analytics fetch failed:', err));
            }, []);

            const sortedWards = React.useMemo(() => {
                return [...wards].sort((a, b) => {
                    let valA = a[sortField];
                    let valB = b[sortField];
                    if (typeof valA === 'string') {
                        return sortAsc ? (valA || '').localeCompare(valB || '') : (valB || '').localeCompare(valA || '');
                    }
                    valA = Number(valA) || 0;
                    valB = Number(valB) || 0;
                    return sortAsc ? valA - valB : valB - valA;
                });
            }, [wards, sortField, sortAsc]);

            const toggleSort = (field) => {
                if (sortField === field) {
                    setSortAsc(!sortAsc);
                } else {
                    setSortField(field);
                    setSortAsc(false);
                }
            };

            const timeSeries = analytics?.time_series || [];
            const chartData = React.useMemo(() => {
                if (!timeSeries || timeSeries.length === 0) return null;
                const maxVal = Math.max(...timeSeries.map(d => Number(d.area_km2) || 0), 1);
                const niceMax = Math.ceil(maxVal * 1.2) || 10;
                const points = timeSeries.map((d, i) => {
                    const x = timeSeries.length === 1 ? 50 : (i / (timeSeries.length - 1)) * 94 + 3;
                    const val = Number(d.area_km2) || 0;
                    const y = 92 - (val / niceMax) * 80;
                    return { ...d, x, y, val };
                });
                const polylineStr = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
                return { points, polylineStr, niceMax };
            }, [timeSeries]);

            const handleExportGeoJSON = () => {
                setExportingGeoJSON(true);
                fetch('http://127.0.0.1:8000/api/v1/flood_map')
                    .then(res => res.json())
                    .then(data => {
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `nyando_flood_extent_${new Date().toISOString().split('T')[0]}.geojson`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    })
                    .catch(err => alert('Failed to export GeoJSON: ' + err.message))
                    .finally(() => setExportingGeoJSON(false));
            };

            const handleExportPDF = () => {
                window.print();
            };

            return (
            <div className="h-full overflow-y-auto bg-gray-50 p-8">
                <div className="max-w-6xl mx-auto space-y-6">
                    <div>
                        <h1 className="text-2xl font-bold text-gray-900">Flood Impact Analytics</h1>
                        <p className="text-sm text-gray-500">Nyando River Basin · May 2024</p>
                    </div>

                    {/* KPI Cards */}
                    <div className="grid grid-cols-4 gap-4">
                        {[
                            { label: "Total inundated area", value: analytics ? `${analytics.total_area_km2} km²` : "—" },
                            { label: "Affected wards",       value: analytics ? `${analytics.affected_wards}` : "—" },
                            { label: "Peak date",            value: analytics ? analytics.peak_date : "—" },
                            { label: "Model version",        value: analytics ? analytics.model_version : "—" }
                        ].map(kpi => (
                            <div key={kpi.label} className="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                                <div className="text-xs text-gray-500 mb-1">{kpi.label}</div>
                                <div className="text-xl font-semibold text-gray-900">{kpi.value}</div>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-3 gap-6">
                        {/* Dynamic Chart Area */}
                        <div className="col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-sm font-bold text-gray-800 mb-4">Inundated area over time (km²)</h3>
                            {!chartData || chartData.points.length === 0 ? (
                                <div className="h-72 w-full flex items-center justify-center border-b border-l border-gray-200 bg-gray-50/50 text-gray-400 text-sm">
                                    No time-series data available
                                </div>
                            ) : (
                                <div className="h-72 w-full relative pt-4 pb-8 border-b border-l border-gray-200">
                                    <svg viewBox="0 0 100 100" className="w-full h-full overflow-visible" preserveAspectRatio="none">
                                        <line x1="0" y1="25" x2="100" y2="25" stroke="#f3f4f6" strokeWidth="0.8" strokeDasharray="2 2" />
                                        <line x1="0" y1="50" x2="100" y2="50" stroke="#f3f4f6" strokeWidth="0.8" strokeDasharray="2 2" />
                                        <line x1="0" y1="75" x2="100" y2="75" stroke="#f3f4f6" strokeWidth="0.8" strokeDasharray="2 2" />
                                        <polyline
                                            points={chartData.polylineStr}
                                            fill="none"
                                            stroke="#1f2937"
                                            strokeWidth="2.5"
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                        />
                                        {chartData.points.map((p, idx) => (
                                            <g key={idx}>
                                                <circle cx={p.x} cy={p.y} r="2.5" fill="#1f2937" stroke="#ffffff" strokeWidth="1" />
                                                {p.date === analytics?.peak_date && (
                                                    <text x={p.x} y={p.y - 4} fontSize="3.5" textAnchor="middle" fill="#4b5563" fontWeight="bold">
                                                        peak ({p.val} km²)
                                                    </text>
                                                )}
                                            </g>
                                        ))}
                                    </svg>
                                    {chartData.points.map((p, idx) => (
                                        <div key={idx}
                                            className="absolute bottom-2 text-[10px] text-gray-500 transform -translate-x-1/2 whitespace-nowrap"
                                            style={{ left: `${p.x}%` }}>
                                            {p.date}
                                        </div>
                                    ))}
                                    <div className="absolute -left-8 top-1 text-[10px] text-gray-400">{chartData.niceMax}</div>
                                    <div className="absolute -left-8 bottom-[50%] text-[10px] text-gray-400">{Math.round(chartData.niceMax / 2)}</div>
                                    <div className="absolute -left-6 bottom-1 text-[10px] text-gray-400">0</div>
                                </div>
                            )}
                        </div>

                        {/* Wards Table */}
                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                            <h3 className="text-sm font-bold text-gray-800 mb-4">Affected wards</h3>
                            <div className="flex-1 overflow-y-auto max-h-72">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-xs text-gray-500 bg-gray-50 uppercase border-y border-gray-200 sticky top-0">
                                        <tr>
                                            <th onClick={() => toggleSort('ward_name')} className="px-2 py-2 cursor-pointer hover:text-gray-900 select-none">
                                                Ward {sortField === 'ward_name' ? (sortAsc ? '↑' : '↓') : ''}
                                            </th>
                                            <th className="px-2 py-2">County</th>
                                            <th onClick={() => toggleSort('flooded_area_km2')} className="px-2 py-2 text-right cursor-pointer hover:text-gray-900 select-none">
                                                Flooded (km²) {sortField === 'flooded_area_km2' ? (sortAsc ? '↑' : '↓') : ''}
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {sortedWards.length === 0 ? (
                                            <tr>
                                                <td colSpan="3" className="px-2 py-4 text-center text-xs text-gray-400">
                                                    No ward impact data available
                                                </td>
                                            </tr>
                                        ) : (
                                            sortedWards.map(w => (
                                                <tr key={w.ward_name} className="hover:bg-gray-50">
                                                    <td className="px-2 py-3 text-gray-900 font-medium">{w.ward_name}</td>
                                                    <td className="px-2 py-3 text-gray-500 text-xs">{w.county || 'Kisumu'}</td>
                                                    <td className="px-2 py-3 text-right font-semibold text-gray-900">
                                                        {w.flooded_area_km2 !== undefined ? `${w.flooded_area_km2} km²` : '—'}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-6 flex space-x-3">
                                <button onClick={handleExportGeoJSON} disabled={exportingGeoJSON}
                                    className="flex-1 bg-gray-900 hover:bg-gray-800 disabled:opacity-50 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                                    {exportingGeoJSON ? 'Exporting…' : 'Export GeoJSON'}
                                </button>
                                <button onClick={handleExportPDF}
                                    className="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium py-2 px-4 rounded transition-colors">
                                    Export PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            );
        };

        const STATUS_COLORS = {
            pending:    'bg-gray-100 text-gray-800',
            processing: 'bg-blue-100 text-blue-800',
            complete:   'bg-green-100 text-green-800',
            failed:     'bg-red-100 text-red-800',
        };

        const UploadView = () => {
            const fileInputRef = React.useRef(null);
            const [apiKey,    setApiKey]    = React.useState('');
            const [file,      setFile]      = React.useState(null);
            const [acqDate,   setAcqDate]   = React.useState('');
            const [source,    setSource]    = React.useState('');
            const [crs,       setCrs]       = React.useState('EPSG:4326');
            const [desc,      setDesc]      = React.useState('');
            const [submitting, setSubmitting] = React.useState(false);
            const [result,    setResult]    = React.useState(null);   // {ok, message}
            const [queue,     setQueue]     = React.useState([]);

            const fetchQueue = (key) => {
                if (!key) return;
                fetch('http://127.0.0.1:8000/api/v1/admin/queue', {
                    headers: { 'X-API-Key': key }
                })
                .then(r => r.json())
                .then(d => setQueue(d.queue || []))
                .catch(() => {});
            };

            React.useEffect(() => { fetchQueue(apiKey); }, [apiKey]);

            const clearForm = () => {
                setFile(null); setAcqDate(''); setSource('');
                setCrs('EPSG:4326'); setDesc(''); setResult(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const handleSubmit = async () => {
                if (!file)   { setResult({ ok: false, message: 'Please select a file.' }); return; }
                if (!apiKey) { setResult({ ok: false, message: 'API key is required.' });  return; }
                setSubmitting(true); setResult(null);
                const fd = new FormData();
                fd.append('file', file);
                fd.append('acquisition_date', acqDate);
                fd.append('source', source);
                fd.append('crs', crs);
                try {
                    const res = await fetch('http://127.0.0.1:8000/api/v1/upload_aerial_image', {
                        method: 'POST',
                        headers: { 'X-API-Key': apiKey },
                        body: fd,
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setResult({ ok: true, message: `Uploaded: ${data.filename} (ID: ${data.image_id})` });
                        clearForm();
                        fetchQueue(apiKey);
                    } else {
                        setResult({ ok: false, message: data.detail || 'Upload failed.' });
                    }
                } catch (e) {
                    setResult({ ok: false, message: 'Network error — is the server running?' });
                } finally {
                    setSubmitting(false);
                }
            };

            return (
            <div className="h-full overflow-y-auto bg-gray-50 p-8">
                <div className="max-w-5xl mx-auto">
                    <div className="mb-6">
                        <h1 className="text-2xl font-bold text-gray-900">Upload Supplementary Aerial Imagery</h1>
                        <p className="text-sm text-gray-500">Restricted to authorised system administrators</p>
                    </div>

                    <div className="grid grid-cols-2 gap-8">
                        {/* Upload Form */}
                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <div className="space-y-5">

                                {/* API Key */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Admin API key *</label>
                                    <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)}
                                        placeholder="X-API-Key value"
                                        className="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                </div>

                                {/* File picker */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Image file *</label>
                                    <input type="file" ref={fileInputRef} accept=".tif,.tiff,.png,.jpg,.jpeg"
                                        className="hidden"
                                        onChange={e => setFile(e.target.files[0] || null)} />
                                    <div onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="mt-1 flex justify-center px-6 pt-8 pb-10 border-2 border-gray-300 border-dashed rounded-lg hover:border-blue-400 cursor-pointer bg-gray-50">
                                        <div className="space-y-2 text-center">
                                            <svg className="mx-auto h-10 w-10 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                                <path d="M24 14v14m-7-7h14M8 32v4a2 2 0 002 2h28a2 2 0 002-2v-4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                                            </svg>
                                            <p className="text-sm text-blue-600 font-medium">
                                                {file ? file.name : 'Click to browse'}
                                            </p>
                                            <p className="text-xs text-gray-500">GeoTIFF, JPEG, PNG up to 500 MB</p>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Acquisition date *</label>
                                    <input type="date" value={acqDate} onChange={e => setAcqDate(e.target.value)}
                                        className="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Image source *</label>
                                    <input type="text" value={source} onChange={e => setSource(e.target.value)}
                                        placeholder="e.g. Drone survey, UNOSAT"
                                        className="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">CRS</label>
                                    <input type="text" value={crs} onChange={e => setCrs(e.target.value)}
                                        placeholder="e.g. EPSG:4326"
                                        className="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Description (optional)</label>
                                    <textarea rows="2" value={desc} onChange={e => setDesc(e.target.value)}
                                        className="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                                </div>

                                {result && (
                                    <div className={`text-sm p-3 rounded-md ${result.ok ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'}`}>
                                        {result.message}
                                    </div>
                                )}

                                <div className="pt-2 flex space-x-3">
                                    <button onClick={handleSubmit} disabled={submitting}
                                        className="bg-gray-900 hover:bg-gray-800 disabled:opacity-50 text-white font-medium py-2 px-6 rounded shadow transition-colors text-sm">
                                        {submitting ? 'Uploading…' : 'Submit for processing'}
                                    </button>
                                    <button onClick={clearForm}
                                        className="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-6 rounded shadow-sm transition-colors text-sm">
                                        Clear form
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Status Panels */}
                        <div className="space-y-6">
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                                <div className="px-5 py-3 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <h3 className="text-sm font-bold text-gray-800">Processing queue</h3>
                                    <button onClick={() => fetchQueue(apiKey)}
                                        className="text-xs text-blue-600 hover:underline">Refresh</button>
                                </div>
                                {queue.length === 0 ? (
                                    <p className="px-5 py-4 text-sm text-gray-400">
                                        {apiKey ? 'Queue is empty.' : 'Enter API key to load queue.'}
                                    </p>
                                ) : (
                                    <ul className="divide-y divide-gray-100 text-sm">
                                        {queue.map(item => (
                                            <li key={item.image_id} className="flex justify-between items-center px-5 py-3">
                                                <div>
                                                    <span className="font-medium text-gray-900 block">{item.file_path.split(/[\/]/).pop()}</span>
                                                    <span className="text-xs text-gray-500">{new Date(item.upload_timestamp).toLocaleDateString()}</span>
                                                </div>
                                                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${STATUS_COLORS[item.processing_status] || STATUS_COLORS.pending}`}>
                                                    {item.processing_status}
                                                </span>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>

                            {/* Log */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                                <h3 className="px-5 py-3 border-b border-gray-200 text-sm font-bold text-gray-800 bg-gray-50">Pipeline run log</h3>
                                <div className="p-5 text-sm font-mono text-gray-600 bg-gray-50 h-48 overflow-y-auto">
                                    <div className="mb-2"><span className="text-gray-400">09 May 14:32</span> <span className="ml-2">Scene acquired from CDSE API</span></div>
                                    <div className="mb-2"><span className="text-gray-400">09 May 14:34</span> <span className="ml-2">Preprocessing complete</span></div>
                                    <div className="mb-2"><span className="text-gray-400">09 May 14:36</span> <span className="ml-2">U-Net inference complete</span></div>
                                    <div className="mb-2"><span className="text-gray-400">09 May 14:37</span> <span className="ml-2">Mask ingested into PostGIS</span></div>
                                    <div className="mb-2 text-blue-600"><span className="text-gray-400">09 May 14:38</span> <span className="ml-2">Dashboard updated</span></div>
                                </div>
                                <div className="px-5 py-3 border-t border-gray-200 flex space-x-3 bg-white">
                                    <button className="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium py-1.5 px-3 rounded shadow-sm transition-colors">Trigger pipeline run</button>
                                    <button className="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium py-1.5 px-3 rounded shadow-sm transition-colors">View full log</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
